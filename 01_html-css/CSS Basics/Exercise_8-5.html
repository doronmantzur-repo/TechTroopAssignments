<html>
     <head>
        <link rel="stylesheet" type="text/css" href="style_8-5.css">
        <title>Exercise 8-4</title>
      </head>
    <body>
        <fieldset>
            <legend>Personale Information</legend>
            <label for="name">Name:</label>
            <input type="text" id ="name" placeholder = "Your Name"><br>
            <label for="email">Email:</label>
            <input type="text" id ="email" placeholder = "Your@email.com"><br>
            <label for="phone">Phone:</label>
            <input type="number" id ="phone" placeholder = "(555) 123-4567">
        </fieldset>
        
        <fieldset>
            <legend>Message Details</legend>
            <label for="subject">Subject:</label>
            <select id="subject">
                <option value = ""> Select subject</option>
                <option value="general">General Inquiry</option>
                <option value="support">Support Request</option>
                <option value="feedback">Feedback</option>
            </select>
            <p>Priority:</p>
            <input type = "radio" id="low" name = "priority" value="low">
            <label for = "low">Low</label>
            <input type = "radio" id="medium" name = "priority" value="medium">
            <label for = "medium">Medium</label>
            <input type = "radio" id="high" name = "priority" value="high">
            <label for = "high">High</label>
            <p>Message:</p>
            <textarea id="message" placeholder="Enter your message here..."></textarea>
        </fieldset>
        <fieldset>
            <legend>Preferences</legend>
            <input type = "checkbox" id = "newsletter" name = "newsletter" value="newsletter">
            <label for = "newsletter">Subscribe to newsletter</label><br>
            <label for="method">Contact Method</label>
            <select id="method">
                <option value = "Email">Email</option>
                <option value = "Phone">Phone</option>
                <option value = "Mail">Mail</option>
            </select>
        </fieldset>
        <button class="green-button">Send Message</button>
        <button class="red-button">Reset</button>
    </body>
</html>
