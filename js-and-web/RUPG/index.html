<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="main.js"></script>

  </head>
  <body>

      <div class="my-frame">
        <div class="up">
          <div class="my-user">
            <div class="image-frame">
              <!-- <img id = "user-id" > -->
            </div>
            <p id="user-name"></p>
          </div>
          <p class="user-quote"></p>
        </div>
        <div class="bottom">
          <div class="left">
            <div class="pokemon">
              <div class="pokemon-frame"></div>
              <!-- <div class="pokemon-img">111</div> -->
              <div class="pokemon-name"></div>

            <div class="line"></div>
            <div class="about-me">
              <h3>About me</h3>
              <p></p>
            </div>
            <div class="commands">
              <button id="button">Generate User</button>
              <button class="save-btn" id="save-btn">Save User</button>
              <select id="users" class="dropdown">
                <option value="">Select User</option>
              </select>

          </div>
          <div class="right"></div>
        </div>
      </div>
    </div>
