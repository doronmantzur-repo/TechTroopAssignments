    <!DOCTYPE html>
    <html>
      <head>
        <link rel="stylesheet" type="text/css" href="style.css">
        <script type="module" src="main.js"></script>
        <title>Exercise 3</title>
      </head>
      <body>
        <div class="form-bcg">
          <div class="form">
            <div class="name-container">
              <div class="label">Name</div>
            </div>
            <div class="name-input">
              <input type="text" id="nameInput" placeholder="Enter your name">
            </div>
            <div class="name-container">
              <div class="label">Desired Salary</div>
              <div class="label">Birthday</div>
            </div>
            <div class="name-input">
              <input type="text" id="salary" placeholder="Enter your desired salary">
              <input type="text" id="birthday" placeholder="Enter your birth date">
            </div>
            <div class="name-container">
              <div class="label" for="Phone">Phone:</div>
            </div>
            <div class="name-input">
              <input type="text" id="phone" placeholder="Enter your phone number">
            </div>
            <div class = "button-container">
              <h3 id="errMsg"></h3>
              <button id = "submitBtn" class = "right">Submit</button>
            </div>

          </div>

        </div>
      </body>
